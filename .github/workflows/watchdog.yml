name: SecuBuzz Feed Watchdog

on:
  # Check feed freshness every 6 hours (offset to :37) to conserve Actions quota
  schedule:
    - cron: "37 */6 * * *"

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    name: Check Production Feed Freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Inspect Live Feed Freshness
        id: check_feed
        continue-on-error: true
        run: |
          node "./scripts/watchdog.mjs"

      - name: Emergency Feed Trigger (If Stale)
        if: steps.check_feed.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚨 Feed was detected as stale or uncontactable!"

          RUNNING=$(gh api "repos/${{ github.repository }}/actions/workflows/ingest.yml/runs" --jq '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued")] | length')
          if [ "$RUNNING" -gt 0 ]; then
            echo "Ingest already running or queued, skipping emergency dispatch."
            exit 0
          fi

          echo "Triggering emergency out-of-band ingestion run..."

          gh workflow run ingest.yml --ref main || curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/ingest.yml/dispatches \
            -d '{"ref":"main"}'

          echo "Emergency ingestion dispatched. Failing step so maintainers receive email telemetry."
          exit 1
