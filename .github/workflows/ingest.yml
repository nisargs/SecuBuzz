name: SecuBuzz Feed Ingestion

on:
  # Run automatically every 1 hour (offset to :17 to avoid global top-of-hour runner congestion)
  # 24 runs/day = ~720-1,080 billable minutes/month, safely within GitHub Actions 2,000 free minutes limit
  schedule:
    - cron: "17 * * * *"

  # Allow manual testing from GitHub Actions
  workflow_dispatch:

concurrency:
  group: secubuzz-ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    name: Ingest Cybersecurity News
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      # Cloudflare R2 credentials
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto

      # Your Cloudflare account ID
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

      # Push Notification Service configuration
      PUSH_TOKEN_API_URL: ${{ secrets.PUSH_TOKEN_API_URL }}
      PUSH_ADMIN_SECRET: ${{ secrets.PUSH_ADMIN_SECRET }}

    steps:

      # ---------------------------------------------------------
      # Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ---------------------------------------------------------
      # Setup Node.js
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ---------------------------------------------------------
      # Verify required secrets
      # ---------------------------------------------------------
      - name: Verify required secrets
        shell: bash
        run: |
          if [ -z "$GROQ_API_KEY" ] && [ -z "$GEMINI_API_KEY" ] && [ -z "$OPENROUTER_API_KEY" ]; then
            echo "No AI API key found (GROQ_API_KEY, GEMINI_API_KEY, or OPENROUTER_API_KEY). At least one is required."
            exit 1
          fi

          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "R2_ACCESS_KEY_ID is missing."
            exit 1
          fi

          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "R2_SECRET_ACCESS_KEY is missing."
            exit 1
          fi

          if [ -z "$R2_ACCOUNT_ID" ]; then
            echo "R2_ACCOUNT_ID is missing."
            exit 1
          fi

          echo "All required secrets are configured."

      # ---------------------------------------------------------
      # Validate ingestion script
      # ---------------------------------------------------------
      - name: Validate ingestion script
        run: |
          node --check "./scripts/ingest.mjs"

      # ---------------------------------------------------------
      # Run SecuBuzz ingestion
      # ---------------------------------------------------------
      - name: Run SecuBuzz ingestion
        run: |
          node "./scripts/ingest.mjs"

      # ---------------------------------------------------------
      # Synchronize website news & RSS data
      # ---------------------------------------------------------
      - name: Sync website news & RSS
        run: |
          node "./scripts/sync_website_data.mjs"

      # ---------------------------------------------------------
      # Assert feed integrity & freshness (Fail CI loudly if stale)
      # ---------------------------------------------------------
      - name: Verify feed integrity & freshness
        run: |
          node "./scripts/verify_feed_freshness.mjs"

      # ---------------------------------------------------------
      # Upload latest feed.json to Cloudflare R2
      # ---------------------------------------------------------
      - name: Upload feed.json to Cloudflare R2
        shell: bash
        run: |
          echo "Uploading feed.json to Cloudflare R2..."

          aws s3 cp "./feed.json" \
            "s3://secubuzz-feed/feed.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type "application/json" \
            --cache-control "no-cache, no-store, must-revalidate"

          echo "feed.json successfully uploaded to Cloudflare R2."

      # ---------------------------------------------------------
      # Commit updated feed files to private GitHub repository
      # ---------------------------------------------------------
      - name: Commit updated feed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed.json seen-urls.json notified-articles.json notified-cves.json website/src/data/news.ts website/src/data/advisories.ts website/public/rss.xml

          if git diff --cached --quiet; then
            echo "No GitHub feed changes to commit."
            exit 0
          fi

          git commit -m "Update SecuBuzz feed"

          git pull --rebase --autostash origin main
          git push origin HEAD:main