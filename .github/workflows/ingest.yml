name: SecuBuzz Feed Ingestion

on:
  # Run automatically every 6 hours
  schedule:
    - cron: "0 */6 * * *"

  # Allow manual testing from GitHub Actions
  workflow_dispatch:

# Required so GitHub Actions can commit updated
# feed.json and seen-urls.json back to the repository.
permissions:
  contents: write

jobs:
  ingest:
    name: Ingest Cybersecurity News
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      # ---------------------------------------------------------
      # Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # Setup Node.js
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ---------------------------------------------------------
      # Verify Groq API key exists
      # ---------------------------------------------------------
      - name: Verify Groq API key
        shell: bash
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY is missing."
            exit 1
          fi

          echo "GROQ_API_KEY is configured."

      # ---------------------------------------------------------
      # Validate JavaScript syntax
      # ---------------------------------------------------------
      - name: Validate ingestion script
        run: |
          node --check "./scripts/ingest.mjs"

      # ---------------------------------------------------------
      # Run SecuBuzz ingestion
      # ---------------------------------------------------------
      - name: Run SecuBuzz ingestion
        run: |
          node "./scripts/ingest.mjs"

      # ---------------------------------------------------------
      # Commit updated feed files
      # ---------------------------------------------------------
      - name: Commit updated feed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed.json seen-urls.json

          if git diff --cached --quiet; then
            echo "No feed changes to commit."
            exit 0
          fi

          git commit -m "Update SecuBuzz feed"

          git push