name: SecuBuzz Feed Ingestion

on:
  # Run automatically every 6 hours
  schedule:
    - cron: "0 */6 * * *"

  # Allow manual testing from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    name: Ingest Cybersecurity News
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # Cloudflare R2 credentials
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto

      # Your Cloudflare account ID
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

      # Push Notification Service configuration
      PUSH_TOKEN_API_URL: ${{ secrets.PUSH_TOKEN_API_URL }}
      PUSH_ADMIN_SECRET: ${{ secrets.PUSH_ADMIN_SECRET }}

    steps:

      # ---------------------------------------------------------
      # Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # Setup Node.js
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ---------------------------------------------------------
      # Verify required secrets
      # ---------------------------------------------------------
      - name: Verify required secrets
        shell: bash
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY is missing."
            exit 1
          fi

          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "R2_ACCESS_KEY_ID is missing."
            exit 1
          fi

          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "R2_SECRET_ACCESS_KEY is missing."
            exit 1
          fi

          if [ -z "$R2_ACCOUNT_ID" ]; then
            echo "R2_ACCOUNT_ID is missing."
            exit 1
          fi

          echo "All required secrets are configured."

      # ---------------------------------------------------------
      # Validate ingestion script
      # ---------------------------------------------------------
      - name: Validate ingestion script
        run: |
          node --check "./scripts/ingest.mjs"

      # ---------------------------------------------------------
      # Run SecuBuzz ingestion
      # ---------------------------------------------------------
      - name: Run SecuBuzz ingestion
        run: |
          node "./scripts/ingest.mjs"

      # ---------------------------------------------------------
      # Upload latest feed.json to Cloudflare R2
      # ---------------------------------------------------------
      - name: Upload feed.json to Cloudflare R2
        shell: bash
        run: |
          echo "Uploading feed.json to Cloudflare R2..."

          aws s3 cp "./feed.json" \
            "s3://secubuzz-feed/feed.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type "application/json" \
            --cache-control "no-cache, no-store, must-revalidate"

          echo "feed.json successfully uploaded to Cloudflare R2."

      # ---------------------------------------------------------
      # Commit updated feed files to private GitHub repository
      # ---------------------------------------------------------
      - name: Commit updated feed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed.json seen-urls.json notified-articles.json

          if git diff --cached --quiet; then
            echo "No GitHub feed changes to commit."
            exit 0
          fi

          git commit -m "Update SecuBuzz feed"

          git push